# DATABASE_URL and MASON_API_KEY. This file is the shape; make the real one without committing it:
#
#   kubectl create secret generic mason \
#     --from-literal=DATABASE_URL='postgres://mason_reader:…@db.example.com:5432/app' \
#     --from-literal=MASON_API_KEY="$(openssl rand -hex 24)"
#
# Changing MASON_API_KEY removes every user at once (`mason user add` each again).
apiVersion: v1
kind: Secret
metadata:
  name: mason
type: Opaque
stringData:
  DATABASE_URL: postgres://mason_reader:password@db.example.com:5432/app
  MASON_API_KEY: replace-with-openssl-rand-hex-24-at-least-32-characters
