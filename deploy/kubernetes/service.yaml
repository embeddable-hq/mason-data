# TWO SERVICES. The Postgres API (5433) for BI tools and apps outside the cluster: a LoadBalancer of type TCP (Mason's
# own TLS is the TLS; an HTTP ingress cannot carry the Postgres protocol — a TCP-capable ingress, e.g. ingress-nginx's
# tcp-services ConfigMap, is the other way). /healthz and /metrics (4140) for the cluster only: a ClusterIP, which is
# also the StatefulSet's serviceName. /metrics is numbers only and takes no secret; the annotations below are the ones
# a Prometheus with the usual kubernetes-service scrape config reads (delete them if yours does not scrape by them).
apiVersion: v1
kind: Service
metadata:
  name: mason-pg
  # a cloud's TCP load balancer is usually the default; restrict who may connect with loadBalancerSourceRanges
  # annotations:
  #   service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: mason
  ports:
    - name: pg
      port: 5433
      targetPort: pg
      protocol: TCP
  # loadBalancerSourceRanges: ["203.0.113.0/24"]
---
apiVersion: v1
kind: Service
metadata:
  name: mason-health
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4140"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: mason
  ports:
    - name: health
      port: 4140
      targetPort: health
      protocol: TCP
