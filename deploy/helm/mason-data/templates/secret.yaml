{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mason.secretName" . }}
  labels:
    {{- include "mason.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "database.url (or database.existingSecret) is required: the database to copy from" .Values.database.url | quote }}
  MASON_API_KEY: {{ required "database.apiKey (or database.existingSecret) is required: at least 32 characters, openssl rand -hex 24" .Values.database.apiKey | quote }}
{{- end }}
