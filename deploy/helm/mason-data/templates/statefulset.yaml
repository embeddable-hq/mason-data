# ONE replica, a StatefulSet: the copy is one file with one writer, and a StatefulSet's RollingUpdate deletes the pod
# before it recreates it on the same PVC. deploy/kubernetes/statefulset.yaml says why, and why a Deployment would need
# `strategy: Recreate`. Not a value: it is what the copy requires.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mason.name" . }}
  labels:
    {{- include "mason.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "mason.name" . }}-health
  selector:
    matchLabels:
      app: {{ include "mason.name" . }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "mason.labels" . | nindent 8 }}
      annotations:
        # a changed sources file restarts the pod: the table is copied or dropped at the next start
        checksum/project: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: mason
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: pg
              containerPort: 5433
            - name: health
              containerPort: 4140
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mason.secretName" . }}
                  key: DATABASE_URL
            - name: MASON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mason.secretName" . }}
                  key: MASON_API_KEY
            - name: MASON_DUCKDB_MEMORY
              value: {{ .Values.memory.copy | quote }}
            {{- if .Values.tls.certSecret }}
            - name: MASON_PG_TLS_CERT
              value: /mason/tls/tls.crt
            - name: MASON_PG_TLS_KEY
              value: /mason/tls/tls.key
            {{- else if .Values.tls.selfSigned }}
            - name: MASON_PG_SELF_SIGNED_TLS
              value: "1"
            {{- end }}
            {{- range $k, $v := .Values.settings }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.cpu | quote }}
              memory: {{ .Values.memory.limit }}
            limits:
              memory: {{ .Values.memory.limit }}
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /mason/data
            - name: project
              mountPath: /mason/project
              readOnly: true
            {{- if .Values.tls.certSecret }}
            - name: tls
              mountPath: /mason/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: project
          configMap:
            name: {{ include "mason.name" . }}-project
            items:
              - key: sources.yml
                path: sources/app.yml
              {{- if .Values.project.masonYml }}
              - key: mason.yml
                path: mason.yml
              {{- end }}
        {{- if .Values.tls.certSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.certSecret }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
