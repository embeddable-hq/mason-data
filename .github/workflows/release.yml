# A RELEASE IS A MERGE. Every push to main (or to a release/* branch, below) looks at the newest
# release-notes/v<version>.md. When no GitHub release
# exists for that version, this push is the release, and the workflow does what would otherwise be done by hand:
#
#   1. the annotated tag v<version> on the merge commit (skipped when the tag already exists). A release from main that
#      starts a new line first cuts the previous line's branch, release/<major>.<minor>, at that line's newest tag,
#      unless the branch exists (the `tag` job says how)
#   2. the image (images-publish.yml, called as a job: a tag made by GITHUB_TOKEN never triggers another workflow)
#   3. the CLI, @mason-data/cli, when its version is not on npm yet; this one also runs when the release page already
#      exists and only the CLI is missing from npm, since its first publish is by hand and may not have happened.
#      Its platform packages first (@mason-data/extensions-<platform>, the copy's extensions: src/duck/extensions.ts),
#      at the same version, each built by cli/extensions.ts from the checksums cli/extensions.json pins and published
#      unless that version is on npm already: the CLI is never published without them, since npm resolves its
#      optional dependencies at install
#   4. the GitHub release from the notes file, last: a release page means everything it names is published
#
# Every step is idempotent, so a failed run is re-run from the Actions page and picks up where it stopped. A merge
# whose newest notes file is already released does nothing (`decide` says so), and so does one before the first notes
# file exists.
#
# A PATCH ON A LINE'S BRANCH IS A MERGE TO IT, release/<major>.<minor> (release-notes/README.md "A patch on a line's
# branch"). The merge releases it in the same way as a merge to main. A release branch releases its own line only:
# `decide` refuses any other version there, before anything is tagged or published. Only the newest release takes the
# names that mean "the newest": npm's `latest` (an older line's patch is published under `latest-<major>.<minor>`), the
# image's `latest`, and GitHub's Latest. The newest is the highest version among this release and every v* tag. The
# image's line tag (`0.19`) moves only forward. scripts/release-line.ts decides all of it.
#
# NO RELEASE RUN IS EVER CANCELLED, AND `latest` NEVER MOVES BACK. A concurrency group holds one running and one pending
# run, and a third run REPLACES the pending one (cancel-in-progress only spares the running one). One group for every
# branch would let a push to main cancel a pending release on release/0.19, and a security fix would silently not
# ship. So the group is per branch: runs of different branches never cancel each other. On one branch, a third push
# while one run runs and one waits still replaces the waiting one. The newer run reads the branch's newest notes:
#   - when the push brought none, it releases the waiting version itself, but tags the later commit it ran on, not the
#     merge of the notes (as on main before release lines);
#   - when the push brought newer notes, the waiting version is never tagged or published. Its fixes ship in the newer
#     release, which holds them.
# Runs of two branches may then overlap, so `decide`'s view of "the newest" can be stale by the time a
# job moves `latest`. Each move re-checks just before it, from the remote's tags (`git ls-remote`): npm's tag in the
# extensions and cli jobs, right before `npm publish`, and the image's `latest` and GitHub's Latest in the release job,
# last. Every run pushes its own tag first, minutes before it builds the image and publishes, so a newer release's tag
# is on the remote long before its own publish, and an older one's re-check sees it. The re-check fails closed: a list
# of tags without the release's own refuses the job, and never reads as "the newest". A newer release that is tagged
# but never finishes keeps `latest` from an older line's patch, so finish or re-run it (release-notes/README.md).
#
# NO NPM CREDENTIAL IS STORED IN THIS REPOSITORY. Trusted publishing on npmjs.com, set up once by an owner of the
# @mason-data org (Settings -> Trusted publisher -> GitHub Actions, repository embeddable-hq/mason-data, workflow
# release.yml): the CLI's job then publishes with this workflow's OIDC identity. npm only offers it on a package that
# already exists, so the package's FIRST publish is by hand (`npm publish` in cli/). Until it is set up, a granular
# access token saved as the repository secret NPM_TOKEN works too; delete it afterwards.
#
# THE FIVE PLATFORM PACKAGES ARE PACKAGES OF THEIR OWN ON NPM, and each needs the same, once, BEFORE THE FIRST RELEASE
# THAT SHIPS THEM IS MERGED — or that release fails at the extensions job (no trusted publisher can be added to a
# package that does not exist yet, and no NPM_TOKEN is set): by an owner of @mason-data, `npm ci && node
# cli/extensions.ts` at the repo's root, then
#   (cd cli/platforms/darwin-arm64 && npm publish --access public)   # @mason-data/extensions-darwin-arm64
#   (cd cli/platforms/darwin-x64   && npm publish --access public)   # @mason-data/extensions-darwin-x64
#   (cd cli/platforms/linux-arm64  && npm publish --access public)   # @mason-data/extensions-linux-arm64
#   (cd cli/platforms/linux-x64    && npm publish --access public)   # @mason-data/extensions-linux-x64
#   (cd cli/platforms/win32-x64    && npm publish --access public)   # @mason-data/extensions-win32-x64
# and then each one's trusted publisher on npmjs.com, as the CLI's (repository embeddable-hq/mason-data, release.yml).
name: Release

on:
  push:
    branches: [main, 'release/*']

permissions:
  contents: write    # the tag and the release
  packages: write    # the image
  id-token: write    # npm's trusted publishing

concurrency:
  group: release-${{ github.ref }}   # per branch: a push to one never cancels a release pending on another (above)
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      cli_publish: ${{ steps.decide.outputs.cli_publish }}
      line_tag: ${{ steps.decide.outputs.line_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags

      - uses: actions/setup-node@v4
        with:
          node-version: '26'          # never 24: ci.yml's build job says why

      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # first, whether this branch may release at all: `release/*` also matches a branch not named for a line (an old
          # release-notes PR's release/v0.20.0). Such a push releases nothing, and the run stays green
          ref="$(node scripts/release-line.ts --ref "$GITHUB_REF")"
          echo "$ref"
          if ! grep -qx 'releases=true' <<<"$ref"; then
            echo "version=" >> "$GITHUB_OUTPUT"; echo "cli_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the newest notes file by version, not by name
          version="$(ls release-notes 2>/dev/null | sed -n 's/^v\([0-9][0-9.]*\)\.md$/\1/p' | sort -V | tail -1)"
          if [ -z "$version" ]; then
            echo "no release-notes/v<version>.md yet: nothing to release"
            echo "version=" >> "$GITHUB_OUTPUT"; echo "cli_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cli="$(node -p 'require("./cli/package.json").version')"
          if [ "$cli" != "$version" ]; then
            echo "cli/package.json is $cli, the newest release notes are v$version: they must agree" >&2; exit 1
          fi
          # the release's line (scripts/release-line.ts): a release branch releases its own line only, and refuses here,
          # before anything is tagged or published. `newest` is said for the log only: each job that moves `latest`
          # re-checks it just before (the header says why)
          line="$(git tag -l 'v*' | node scripts/release-line.ts "$GITHUB_REF" "$version")"
          echo "$line"; echo "$line" >> "$GITHUB_OUTPUT"
          # the CLI is judged on its own: a release whose page exists but whose CLI never reached npm (the first publish
          # is by hand, and may not have happened) is still published by the next push to this branch
          if npm view "@mason-data/cli@$cli" version >/dev/null 2>&1; then
            echo "@mason-data/cli $cli is on npm already"; echo "cli_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@mason-data/cli $cli is not on npm: it is published"; echo "cli_publish=true" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v$version" --json tagName >/dev/null 2>&1; then
            echo "v$version is released already: nothing else to do"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "releasing v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  tag:
    needs: decide
    if: needs.decide.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the previous line's branch and the tag; nothing else
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'          # never 24: ci.yml's build job says why
      # A NEW LINE CUTS THE PREVIOUS LINE'S BRANCH FIRST (scripts/release-line.ts `--cut`; release-notes/README.md "Where
      # breaking changes wait"): release/<major>.<minor> at that line's newest tag, before this release is tagged. It
      # never moves a branch that exists. When it cannot create the branch, the run fails here, before anything is
      # tagged or published, and a re-run picks up from this step
      - name: the previous line's branch, when this release starts a new line
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          cut="$(git ls-remote --refs origin 'refs/tags/v*' 'refs/heads/release/*' | node scripts/release-line.ts --cut "$GITHUB_REF" "$VERSION")"
          echo "$cut"
          grep -qx 'cut=true' <<<"$cut" || exit 0
          branch="$(sed -n 's/^branch=//p' <<<"$cut")"; from="$(sed -n 's/^from=//p' <<<"$cut")"
          sha="$(git rev-parse "refs/tags/$from^{commit}")"
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$sha" >/dev/null; then
            # another run may have cut it meanwhile: a branch that exists is kept where it is, wherever that is
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
              echo "$branch exists already, at $(git ls-remote --heads origin "refs/heads/$branch" | cut -f1): it is not moved"; exit 0
            fi
            echo "Could not create $branch at $from ($sha), so v$VERSION is not tagged or published. The release ruleset on release/* must let GitHub Actions create the branch: release-notes/README.md \"The ruleset on release/*\" says how. Then re-run this run." >&2
            exit 1
          fi
          at="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          if [ "$at" != "$sha" ]; then echo "$branch was created, but the remote shows it at '$at', not $sha" >&2; exit 1; fi
          echo "$branch is cut at $from ($sha)"
      - name: the annotated tag, on the merge commit
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION exists at $(git rev-parse "v$VERSION^{commit}")"
          else
            git tag -a "v$VERSION" -m "Mason v$VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/v$VERSION"
          fi

  image:
    needs: [decide, tag]
    uses: ./.github/workflows/images-publish.yml
    with:
      version: ${{ needs.decide.outputs.version }}
      line: ${{ needs.decide.outputs.line_tag == 'true' }}
    permissions:
      contents: read
      packages: write

  # the CLI's platform packages, before it: one a platform, each at the CLI's version (cli/extensions.ts)
  extensions:
    needs: [decide, tag, image]
    # ONLY for a release: this push releases (`version`), or the release exists and its CLI is missing from npm
    # (`cli_publish`). A push that releases nothing publishes nothing. Within a release it publishes whichever of them
    # npm lacks at the CLI's version, so a CLI published by hand before its packages is repaired by the release's run
    if: always() && needs.decide.result == 'success' && (needs.decide.outputs.version != '' || needs.decide.outputs.cli_publish == 'true') && needs.image.result != 'failure' && needs.tag.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'          # never 24: ci.yml's build job says why
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      # the script reads the engine's version from the repo's @duckdb/node-api, which must be the one cli/extensions.json pins
      - run: npm ci
      - name: build every platform's package, each file held to its pinned checksum
        run: node cli/extensions.ts
      - name: publish each one whose version is not on npm yet
        env:
          # Empty when the secret is not set, which is the trusted-publishing case.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in cli/platforms/*/; do
            name="$(node -p "require('./${dir}package.json').name")"; version="$(node -p "require('./${dir}package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name $version is on npm already"; continue; fi
            # the re-check, from the remote's tags, just before the publish moves a dist-tag (the header says why)
            tag="$(git ls-remote --tags --refs origin 'refs/tags/v*' | node scripts/release-line.ts "$GITHUB_REF" "$version" npm_tag)"
            echo "$name $version is published under $tag"
            (cd "$dir" && npm publish --access public --tag "$tag")
          done

  cli:
    needs: [decide, tag, image, extensions]
    # after the image and its platform packages when this push releases; alone when the release exists and only the CLI
    # is missing from npm. Never without its platform packages published
    if: always() && needs.decide.result == 'success' && needs.decide.outputs.cli_publish == 'true' && needs.image.result != 'failure' && needs.tag.result != 'failure' && needs.extensions.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'          # never 24: ci.yml's build job says why
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      # the package builds from the repo's src/ with the repo's TypeScript (cli/build.ts, its prepack); cli/ has no lock
      # of its own (its optional platform packages are published by the job before this one)
      - run: npm ci
      - name: publish, under the dist-tag the remote's tags say now
        env:
          # Empty when the secret is not set, which is the trusted-publishing case.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./cli/package.json").version')"
          # the re-check, from the remote's tags, just before the publish moves a dist-tag (the header says why)
          tag="$(git ls-remote --tags --refs origin 'refs/tags/v*' | node scripts/release-line.ts "$GITHUB_REF" "$version" npm_tag)"
          echo "@mason-data/cli $version is published under $tag"
          cd cli && npm publish --access public --tag "$tag"

  release:
    needs: [decide, tag, image, extensions, cli]
    # the release page comes last, once everything it names is published: a publish job that succeeded, or was skipped
    # because npm has it already — never one that failed or was cancelled
    if: always() && needs.decide.outputs.version != '' && needs.tag.result == 'success' && needs.image.result == 'success' && (needs.extensions.result == 'success' || needs.extensions.result == 'skipped') && (needs.cli.result == 'success' || needs.cli.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'          # never 24: ci.yml's build job says why
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the re-check, from the remote's tags, just before `latest` moves (the header says why)
      - id: newest
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          newest="$(git ls-remote --tags --refs origin 'refs/tags/v*' | node scripts/release-line.ts "$GITHUB_REF" "$VERSION" newest)"
          echo "v$VERSION is the newest release: $newest"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
      # the image's `latest`, on the newest release only: the image job published <version> and its line, never latest
      - if: steps.newest.outputs.newest == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/mason-data
          VERSION: ${{ needs.decide.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.decide.outputs.version }}
          NEWEST: ${{ steps.newest.outputs.newest }}
        run: |
          set -euo pipefail
          # the file's first line is the release's name; the rest is its body
          tail -n +2 "release-notes/v$VERSION.md" > /tmp/notes.md
          # Latest is set from the re-check, never left to GitHub, which would choose by date and version itself
          gh release create "v$VERSION" --title "Mason v$VERSION" --notes-file /tmp/notes.md --verify-tag --latest="$NEWEST"
