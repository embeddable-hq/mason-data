# The full gate, on every pull request and on main. A pull request's run checks out GitHub's merge of its head into main
# as main stood at that push.
#
# THE FOUR REQUIRED CHECKS ARE `checks`, `image`, `integration (oracle)` and `integration (rest)`: the ruleset on main
# names them, so those names stay. All but `image` are final jobs that `needs` their shards: each runs `always()`, and
# passes only when every job behind it answered `success`, or `skipped` where the run's mode skips it (THE DOCS PATH,
# below; `scripts/ci-shards.ts needs`), because a skipped job counts
# as passing a required check on GitHub. `always()`, not `!cancelled()`, for the same reason: a cancelled run must not
# skip the job that would say so. tests/ci-shards.test.ts holds this file to all of it.
#
#   checks                  build (once: typecheck, the CLI, the platform packages, the install, shellcheck), and
#                           unit (1-3): every tests/**/*.test.ts file in exactly one shard (`scripts/ci-shards.ts verify`)
#                           (a docs-only run: docs, the unit tests that read a doc, in place of both)
#   image                   the image builds and answers (a docs-only run builds none, and says so)
#   integration (rest)      rest shard (1-2): every integration file but the oracle, in exactly one shard
#   integration (oracle)    oracle leg (1-2): each the copy, the rounds of changes and its share of the statements; the
#                           check holds the legs to the whole (`scripts/oracle-legs.ts`)
#
# THE DOCS PATH. `changes` reads what the pull request changed, from git on the merge CI checked out
# (`scripts/ci-shards.ts changes`). When every path is a doc (a root .md file, or one under docs/, deploy/ or
# release-notes/; never a CLAUDE.md), build, unit, oracle and rest are skipped and `docs` runs the unit tests that read a
# doc in their place; the four checks still report, each reading the mode from its own needs, and `image` builds nothing
# and says so. Whatever `changes` cannot tell (a push to main, a merge it cannot read) is a full run, and a gate that
# cannot tell the mode (a failed `changes`) fails. No `paths` filter on the workflow: a required check that never reports blocks a pull request for ever.
#
# A shard's files are computed from the tree (`scripts/ci-shards.ts`), so a new file lands in one by itself; the unit
# shards are balanced by each file's time as a CI run measured it (tests/fixtures/unit-weights.json, rewritten by
# `node scripts/ci-shards.ts weights <run-id>` when `checks` warns the shards ran more than a minute apart). Only
# `build` and `unit` run on the runner alone: no Docker, no Postgres, no .env. The integration jobs run the real thing
# against a Postgres service container: the copy and the poll, the stream (logical replication), `mason serve`'s whole
# life, to_char, and the oracle — every statement answered by Mason held equal to what the Postgres it copies from
# answers (tests/integration/README.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the pull request changes nothing but docs: docs=true or docs=false, read by every job below from
  # needs.changes.outputs.docs (THE DOCS PATH, above). The merge's two parents are its base and the head, hence depth 2.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '26'          # never 24: the build job says why
      - name: what the pull request changed
        id: classify
        run: node scripts/ci-shards.ts changes

  build:
    name: build
    needs: [changes]
    if: ${{ needs.changes.outputs.docs == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 26, never 24: Node 24's V8 (13.6) can abort a process whose WebAssembly instances die beside another
          # thread's (`jit_page_->allocations_.erase(addr) == 1`, nodejs/node#66366; docs/DESIGN.md "The Node CI runs
          # on"); tests/conventions.test.ts holds every workflow to it. >= 23.6: the .ts files run via type stripping
          node-version: '26'
          cache: npm

      - run: npm ci

      # Every check below runs even when an earlier one fails, so one CI round reports every problem instead of one
      # per push.
      - name: typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      # The published CLI (@mason-data/cli): src/ compiled to JavaScript (cli/build.ts), because Node strips no types
      # under node_modules. This proves the ARTIFACT runs: the built `mason` answers.
      - name: cli builds and runs
        if: ${{ !cancelled() }}
        run: |
          node cli/build.ts
          node cli/dist/src/cli/mason.cjs --version
          node cli/dist/src/cli/mason.cjs --help > /dev/null

      # The CLI's platform packages (cli/extensions.ts): every platform's copy of the two extensions fetched and held
      # to the checksums cli/extensions.json pins, each package packed as npm would publish it; and the CLI's own tarball
      # holds none of them (they reach a user as its optional dependencies, one platform's alone).
      - uses: actions/cache@v4
        if: ${{ !cancelled() }}
        with:
          path: cli/platforms
          key: extensions-${{ hashFiles('cli/extensions.json') }}
      - name: platform packages build
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node cli/extensions.ts
          for dir in cli/platforms/*/; do (cd "$dir" && npm pack --dry-run --json | node -e '
            const [p] = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const ext = p.files.filter((f) => f.path.endsWith(".duckdb_extension"));
            if (ext.length !== 2) { console.error(`${p.name}: ${ext.length} extension file(s), not 2`); process.exit(1); }
            console.log(`${p.name} ${p.version}: ${(p.size / 2 ** 20).toFixed(1)} MiB packed, ${(p.unpackedSize / 2 ** 20).toFixed(1)} MiB installed`);'); done
          (cd cli && npm pack --dry-run --json --ignore-scripts | node -e '
            const [p] = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const ext = p.files.filter((f) => /duckdb_extension|^platforms\//.test(f.path));
            if (ext.length) { console.error(`@mason-data/cli would ship ${ext.map((f) => f.path).join(", ")}`); process.exit(1); }
            console.log(`${p.name} ${p.version}: ${p.files.length} files, ${(p.size / 2 ** 20).toFixed(1)} MiB packed, no extension`);')

      # What a user installs: the packed CLI and this runner's platform package, installed globally into a prefix of
      # their own (npm skips the optional ones it cannot find, none being on npm at this version), and the installed
      # `mason doctor`, with HOME an empty folder, finds the extensions in the package and downloads nothing. Two
      # tarballs install side by side (hoisted); a registry install nests the package under the CLI's node_modules,
      # which the same walk up from dist/src/duck/ finds (checked by hand, not here).
      - name: the installed CLI finds its platform package
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          t="$(mktemp -d)"; mkdir "$t/home"
          (cd cli && npm pack --ignore-scripts --pack-destination "$t" > /dev/null)
          (cd cli/platforms/linux-x64 && npm pack --pack-destination "$t" > /dev/null)
          npm install -g --prefix "$t/prefix" "$t"/mason-data-cli-*.tgz "$t"/mason-data-extensions-linux-x64-*.tgz
          # doctor's exit is every check's (a port the runner holds would fail it): the extensions line is read from its JSON
          (cd "$t/home" && HOME="$t/home" "$t/prefix/bin/mason" doctor --json || true) | node -e '
            const c = JSON.parse(require("fs").readFileSync(0, "utf8")).checks.find((x) => x.name === "extensions");
            console.log(JSON.stringify(c));
            if (c?.ok !== true || !/ship with Mason \(@mason-data\/extensions-linux-x64 /.test(c.detail)) process.exit(1);'
          test -z "$(ls -A "$t/home")" || { echo "the installed CLI wrote to HOME: $(find "$t/home")" >&2; exit 1; }

      # shellcheck is preinstalled on the ubuntu-latest runner image; nothing to check when no script is bash.
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: |
          files=$(grep -rl '^#!/usr/bin/env bash' scripts/ || true)
          if [ -n "$files" ]; then shellcheck $files; else echo "no bash script under scripts/"; fi

  # The unit tests, one shard of them a job: scripts/ci-shards.ts computes each shard's files from the tree, and records
  # each file's time, the shard's wall time and its CPU in the shard's ran-unit-<n> artifact.
  unit:
    name: unit (${{ matrix.shard }})
    needs: [changes]
    if: ${{ needs.changes.outputs.docs == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'          # never 24: the build job says why
          cache: npm

      - run: npm ci

      - name: unit tests
        env:
          CI_SHARD_DIR: ${{ runner.temp }}/ran
        run: |
          set -o pipefail
          node scripts/ci-shards.ts run unit ${{ matrix.shard }} | tee "$RUNNER_TEMP/unit-tests.log"

      # Where the job's minutes went: the twenty slowest tests of the run above, in seconds.
      - name: slowest tests
        if: ${{ !cancelled() }}
        run: sed -nE 's/^ *[^ ]+ (.*) \(([0-9.]+)ms\)$/\2 \1/p' "$RUNNER_TEMP/unit-tests.log" | sort -rn | awk 'NR <= 20 { s = $1 / 1000; sub(/^[^ ]+ /, ""); printf "%8.1f %s\n", s, $0 }'

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ran-unit-${{ matrix.shard }}
          path: ${{ runner.temp }}/ran/
          retention-days: 7
          overwrite: true

  # A docs-only run's tests, in place of build and unit: the unit tests that read a doc (DOCS_TESTS, scripts/ci-shards.ts).
  docs:
    name: docs
    needs: [changes]
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'          # never 24: the build job says why
          cache: npm

      - run: npm ci

      - name: the unit tests that read a doc
        run: node scripts/ci-shards.ts docs

  # REQUIRED. Fails unless `build` and every unit shard succeeded, and every test file ran in exactly one shard; then
  # says how far apart the shards ran, and warns past a minute (never failing on it). On a docs-only run, fails unless
  # `docs` succeeded and build and unit were skipped.
  checks:
    name: checks
    needs: [changes, build, unit, docs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: every job behind this check succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-shards.ts needs
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() && needs.changes.outputs.docs != 'true' }}
        with:
          pattern: ran-unit-*
          merge-multiple: true
          path: ran
      - name: every test file ran in exactly one shard
        if: ${{ !cancelled() && needs.changes.outputs.docs != 'true' }}
        run: node scripts/ci-shards.ts verify unit ran

  # REQUIRED. The image (docker/mason-data.Dockerfile), built as images-publish.yml builds it (one platform here): it
  # starts, `mason --version` inside it answers, and on the image's own Node (tests/conventions.test.ts holds its major
  # to this file's node-version) the three things a run loads answer a statement: the engine's native bindings, PGlite
  # and libpg-query (issue 67). `mason --version` loads none of them. It runs whatever `changes` answered, short of a
  # cancel (a job skipped for a failed need reports success on a required check), and builds unless the run is
  # docs-only: the image copies no doc.
  image:
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: a docs-only run builds no image
        if: ${{ needs.changes.outputs.docs == 'true' }}
        run: echo "the image is not built, since nothing but docs changed and the image copies no doc"
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.docs != 'true' }}
      - name: build mason-data
        if: ${{ needs.changes.outputs.docs != 'true' }}
        run: docker build -f docker/mason-data.Dockerfile -t mason-data:ci .
      - name: the mason command inside it answers
        if: ${{ needs.changes.outputs.docs != 'true' }}
        run: docker run --rm --entrypoint mason mason-data:ci --version
      - name: it runs as uid 1000 (node), the user a supervisor creates the socket's folder for (deploy/mason-data/README.md)
        if: ${{ needs.changes.outputs.docs != 'true' }}
        run: |
          id=$(docker run --rm --entrypoint id mason-data:ci)
          echo "$id"
          case "$id" in "uid=1000(node) gid=1000(node) "*|"uid=1000(node) gid=1000(node)") ;; *) echo "the image must run as uid=1000(node) gid=1000(node)"; exit 1 ;; esac
      - name: the engine, PGlite and libpg-query load and answer on the image's Node
        if: ${{ needs.changes.outputs.docs != 'true' }}
        timeout-minutes: 5
        run: |
          docker run --rm -i -w /app --entrypoint node mason-data:ci --input-type=module - <<'JS'
          const check = (what, ok, got) => { if (!ok) { console.error(`${what}: unexpected answer ${JSON.stringify(got)}`); process.exit(1); } console.log(`${what}: ok`); };
          console.log(`node ${process.version}`);
          const { DuckDBInstance } = await import("@duckdb/node-api");
          const duck = await DuckDBInstance.create(":memory:");
          const conn = await duck.connect();
          const rows = (await conn.runAndReadAll("SELECT 42 AS x")).getRows();
          check("the engine's native bindings answer SELECT 42", rows[0]?.[0] === 42, rows);
          conn.closeSync(); duck.closeSync();
          const { PGlite } = await import("@electric-sql/pglite");
          const pglite = await PGlite.create();
          const one = (await pglite.query("SELECT 1 AS x")).rows;
          check("PGlite answers SELECT 1", one[0]?.x === 1, one);
          await pglite.close();
          const parser = await import("libpg-query");
          await parser.loadModule();
          const tree = parser.parseSync("SELECT 1");
          check("libpg-query parses SELECT 1", tree.stmts?.length === 1, tree);
          JS

  # THE ORACLE, IN LEGS: each leg runs the whole pipeline over a Postgres of its own, and asks its share of the
  # statements in every phase (scripts/oracle-legs.ts). A leg's job is the rest shards' below, by YAML anchor.
  oracle:
    name: oracle leg ${{ matrix.shard }}
    needs: [changes]
    if: ${{ needs.changes.outputs.docs == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [oracle]
        shard: [1, 2]
    # The Postgres every file copies from. Each file writes only inside a database it creates and drops; the stream
    # needs wal_level=logical (set below: a service takes no command line). psql is on the runner image.
    services: &postgres-service
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: it
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env: &postgres-env
      IT_POSTGRES_URL: postgres://postgres:it@127.0.0.1:5432/postgres
    steps: &integration-steps
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'          # never 24: the build job says why
          cache: npm

      - run: npm ci

      # this runner's platform package, built into cli/platforms/ (extensions.itest.ts installs it read-only on its own)
      # and installed into node_modules as a user's install has it: every integration test then runs in SHIPPED mode,
      # nothing downloaded, and the oracle refuses to run otherwise (the reuse path makes the second command free)
      - uses: actions/cache@v4
        with:
          path: cli/platforms
          key: extensions-${{ hashFiles('cli/extensions.json') }}
      - run: node cli/extensions.ts linux-x64
      - run: node cli/extensions.ts --node-modules node_modules

      - name: logical replication on the service Postgres
        run: |
          psql "$IT_POSTGRES_URL" -c "ALTER SYSTEM SET wal_level = logical"
          docker restart ${{ job.services.postgres.id }}
          for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 && break; sleep 1; done
          test "$(psql "$IT_POSTGRES_URL" -tAc 'SHOW wal_level')" = logical

      # one shard's files, one at a time (every file makes a database of its own, but each runs a listener on a port
      # and a store of its own, and two at once double the runner's load)
      - name: integration tests
        env:
          CI_SHARD_DIR: ${{ runner.temp }}/ran
          IT_LOG_DIR: ${{ runner.temp }}/ran
        run: |
          mkdir -p "$IT_LOG_DIR"
          node scripts/ci-shards.ts run ${{ matrix.kind }} ${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ran-${{ matrix.kind }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/ran/
          retention-days: 7
          overwrite: true

  # THE COLLATION RESOLVER UNDER AN ICU AND A C DATABASE (issue 253, decision B): the service's database is glibc's
  # en_US.utf8, so the legs above ask every statement under libc; this asks the resolver's statements
  # (tests/integration/oracle/collations.ts) and the collation gaps under the other two providers, in a database made on
  # the same service (IT_ORACLE_COLLATION). Not a leg: no leg report, and its artifact is outside `ran-oracle-*`, so
  # the legs' whole (scripts/oracle-legs.ts) is the default database's alone. The whole oracle under each is issue 403's.
  collation:
    name: oracle collation ${{ matrix.collation }}
    needs: [changes]
    if: ${{ needs.changes.outputs.docs == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        collation: [icu, c]
    services: *postgres-service
    env: *postgres-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'          # never 24: the build job says why
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: cli/platforms
          key: extensions-${{ hashFiles('cli/extensions.json') }}
      - run: node cli/extensions.ts linux-x64
      - run: node cli/extensions.ts --node-modules node_modules
      - name: the collation statements under ${{ matrix.collation }}
        env:
          IT_ORACLE_COLLATION: ${{ matrix.collation }}
          IT_ORACLE_ONLY: '^collation: |^the table colls(_case)?,|^gap case: (collation-unknown|hypothetical-set)$'
          TMPDIR: ${{ runner.temp }}/collation
        run: |
          mkdir -p "$TMPDIR"
          node --test --test-timeout=1500000 --test-force-exit tests/integration/duck-oracle.itest.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: collation-${{ matrix.collation }}
          path: ${{ runner.temp }}/collation/duck-oracle-differences.txt
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # REQUIRED. Fails unless both legs and both collations succeeded (on a docs-only run: were skipped), and together the
  # legs asked every statement in every phase and hold what a whole run asserts at its end: no stale decision, no dead
  # gap, src/duck/verified.ts, the fixture's tallies.
  integration-oracle:
    name: integration (oracle)
    needs: [changes, oracle, collation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: every job behind this check succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-shards.ts needs
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() && needs.changes.outputs.docs != 'true' }}
        with:
          pattern: ran-oracle-*
          merge-multiple: true
          path: ran
      - name: every leg ran
        if: ${{ !cancelled() && needs.changes.outputs.docs != 'true' }}
        run: node scripts/ci-shards.ts verify oracle ran
      - name: the legs are the whole oracle
        if: ${{ !cancelled() && needs.changes.outputs.docs != 'true' }}
        run: node scripts/oracle-legs.ts ran

  # Every other integration file, one shard of them a job: a new file lands in one by itself.
  rest:
    name: rest shard ${{ matrix.shard }}
    needs: [changes]
    if: ${{ needs.changes.outputs.docs == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [rest]
        shard: [1, 2]
    services: *postgres-service
    env: *postgres-env
    steps: *integration-steps

  # REQUIRED. Fails unless both shards succeeded, and every file ran in exactly one (on a docs-only run: unless both
  # were skipped).
  integration-rest:
    name: integration (rest)
    needs: [changes, rest]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: every job behind this check succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-shards.ts needs
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() && needs.changes.outputs.docs != 'true' }}
        with:
          pattern: ran-rest-*
          merge-multiple: true
          path: ran
      - name: every integration file ran in exactly one shard
        if: ${{ !cancelled() && needs.changes.outputs.docs != 'true' }}
        run: node scripts/ci-shards.ts verify rest ran
