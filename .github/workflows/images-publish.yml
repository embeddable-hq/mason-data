# Publishes the image an application runs Mason from (deploy/mason-data/):
#
#   ghcr.io/embeddable-hq/mason-data   one container, `mason serve` (docker/mason-data.Dockerfile)
#
# Every push to main publishes it as `main` (a moving tag: what deploy/mason-data/compose.yml pulls by default before a
# release exists) and `sha-<commit>` (pinnable). A release publishes `<version>` and `latest`: release.yml calls this
# workflow with the version once the merge of release-notes/v<version>.md is tagged (a tag made by a workflow's own
# token triggers no workflow, so it is a call, not a tag push); a tag `v<version>` pushed by hand still publishes the
# same. Both platforms an application deploys on: amd64 (a server) and arm64 (a developer's Mac).
#
# The registry credential is the workflow's own GITHUB_TOKEN (packages: write); nothing is stored. The image is
# PUBLIC, as the repository is: a machine pulls it with no login.
name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_call:
    inputs:
      version:
        description: the release's version (1.2.3), published as <version> and latest
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mason-data
          # a release (the version given, or a v* tag pushed by hand): <version> and latest; main: main and sha-<commit>
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=ref,event=branch,enable=${{ inputs.version == '' }}
            type=sha,prefix=sha-,enable=${{ inputs.version == '' }}
            type=semver,pattern={{version}}
          # `latest` only on a release, never on main
          flavor: latest=${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mason-data.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the version the image reports (`mason --version`, /healthz, `version()` on the Postgres API; src/cli/version.ts)
          build-args: MASON_VERSION=${{ inputs.version != '' && format('v{0}', inputs.version) || (github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha)) }}
          cache-from: type=gha,scope=mason-data
          cache-to: type=gha,scope=mason-data,mode=max
