<text x="486" y="932" font-size="24" fill="#e5e7eb" font-weight="800">What is exact is decided by an oracle</text>
<text x="486" y="966" font-size="18" fill="#cbd5e1">Tens of thousands of queries are run on a real Postgres and on Mason and compared, offline;</text>
<text x="486" y="992" font-size="18" fill="#cbd5e1">only what came back identical is allowed.</text>
