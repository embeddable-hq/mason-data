<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1600" height="1060" viewBox="0 0 1600 1060" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">How Mason works</title>
<desc id="desc">Mason syncs the tables and columns you choose from a Postgres. Each table stays in sync on demand (mason sync, the default), by polling, or by logical replication. One process holds the synced tables in a columnar engine and answers the Postgres wire protocol. Each connection is a user, and its role limits the tables, columns and rows it can read. A real Postgres resolves each query. A verified query is rewritten into the form the engine runs fastest and run on the columnar tables, and anything not verified exact is refused by name. Every query is logged. An oracle decides what is exact.</desc>
<rect x="0" y="0" width="1600" height="1060" rx="0" fill="#0b1220"/>
<text x="800" y="88" font-size="56" fill="#f1f5f9" font-weight="800" text-anchor="middle" letter-spacing="-1">How Mason works</text>
<text x="800" y="134" font-size="26" fill="#94a3b8" text-anchor="middle">A drop-in replacement for your Postgres read replica. Same SQL. Same answers. Seconds, not minutes</text>
