<text x="290" y="514" font-size="16" fill="#cbd5e1">then, per table:</text>
<text x="290" y="541" font-size="16" fill="#cbd5e1"><tspan font-weight="700" fill="#e5e7eb">on demand</tspan> (default)</text>
<text x="290" y="561" font-size="15" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">mason sync &lt;table&gt;</text>
